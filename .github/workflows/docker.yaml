name: Docker

on:
  pull_request:
  push:
    branches: ['main']
    tags: ['v*']

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  docker:
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@c7f24b7a3dc1110838186b173b1f1a2a65ff1c91 # v2.0.22
    with:
      push: ${{ github.event_name != 'pull_request' }}
      build-args: |
        VITE_APP_VERSION=${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        VITE_APP_COMMIT=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
